<body>
    <header>
        <h1>
            NDH: Cadastro do Newsletter
        </h1>

    </header>
    <hr>
    <main>
        <form onsubmit="alert('Enviado com sucesso'); return false">
            <label>Nome:
                <input type="text" required placeholder="Digite seu Nome aqui:" maxlength="250">
            </label>
            <br>
            <br>
            <label>Data de Nascimento:
                <input type="date" required>
            </label>
            <br>
            <br>
            <label>E-mail:
                <input type="text" required placeholder="Digite seu E-mail aqui:" maxlength="150">
            </label>
            <br>
            <br>
            <label>Senha:
                <input type="password" required placeholder="Escreva sua Senha aqui:">
            </label>
            <br>
            <br>
            <label>
                <input type="color" required>
            </label>Sua cor favorita:
            <br>
            <br>
            <button type="submit">
                Envie aqui!
            </button>
        </form>
        
    </main>
